<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Effects Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="intro">
      <p class="eyebrow">A little CSS practice</p>
      <h1>Meet the animal friends</h1>
      <p class="lead">Move your pointer over a picture to see its transformation.</p>
    </header>

    <section class="gallery" aria-label="Animal photo gallery">
      <article class="photo-card">
        <div class="photo-frame">
          <img src="https://placedog.net/700/500?id=10" alt="A golden retriever sitting outdoors">
        </div>
        <h2>Biscuit</h2>
        <p>Sunny days and long walks.</p>
      </article>

      <article class="photo-card">
        <div class="photo-frame">
          <img src="https://cataas.com/cat?width=700&height=500&position=center" alt="A cat looking toward the camera">
        </div>
        <h2>Marmalade</h2>
        <p>Curious, calm, and very cuddly.</p>
      </article>

      <article class="photo-card">
        <div class="photo-frame">
          <img src="https://placedog.net/700/501?id=25" alt="A border collie relaxing outside">
        </div>
        <h2>Pepper</h2>
        <p>Ready for a game of fetch.</p>
      </article>
    </section>
  </main>
</body>
</html>
